# Valores de settings que el TV debe tener. Lo aplica scripts/apply-settings.sh.
# Formato: <ola> <namespace> <clave> <valor>   # motivo
# namespace: global | secure | system | device_config:<namespace>

# ------------------------------------------------------------------ Ola 0: estado previo que se mantiene
0 global window_animation_scale 0.0          # sin animación de ventanas
0 global transition_animation_scale 0.0      # sin animación de transiciones
0 global wifi_scan_always_enabled 0          # sin escaneo WiFi permanente
0 secure screensaver_enabled 1               # protector de pantalla activo
0 secure screensaver_components com.neilturner.aerialviews/com.neilturner.aerialviews.ui.screensaver.DreamActivity
0 secure screensaver_activate_on_sleep 1
0 system screen_off_timeout 600000           # protector a los 10 minutos
0 secure sleep_timeout -1                    # no apagar por inactividad

# ------------------------------------------------------------------ Ola 1: ajustes sin riesgo
1 global animator_duration_scale 0.5         # 0 desactiva los animadores: spinners y foco se congelan en algunas apps
1 global ble_scan_always_enabled 0           # sin escaneo Bluetooth LE permanente
1 global wifi_networks_available_notification_on 0   # sin avisos de redes WiFi abiertas

# ------------------------------------------------------------------ Ola 5: descartado
# use_compaction (compactar apps en caché hacia zram) NO se aplica: el kernel es 4.14 y no tiene
# process_madvise ni /proc/<pid>/reclaim, así que Android no puede compactar (verificado 2026-11-06).
# 5 device_config:activity_manager use_compaction true

# ------------------------------------------------------------------ Ola 6 (etapa 2): launcher
# Servicio de accesibilidad de Plume: con él reasigna los botones Netflix/YouTube/engranaje
# (config/buttons.conf) y hace que Inicio abra Plume. Mismo formato que escribe Plume
# (ComponentName.flattenToString), para que doctor.sh no vea diferencias. apply.sh aplica appops
# antes que settings: si el servicio se activa sin APP_AUTO_START, TCL bloquea el arranque y Android
# no reintenta (pasó en la prueba del 2026-11-09).
6 secure enabled_accessibility_services dev.plume/dev.plume.HomeOverride
6 secure accessibility_enabled 1
