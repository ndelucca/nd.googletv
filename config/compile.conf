# Modo de compilación ART por paquete. Lo aplica scripts/apply-compile.sh.
# Formato: <ola> <paquete> <speed|speed-profile>   # motivo
#
# Hoy casi todo está en speed-profile (lo hace el sistema solo). "speed" compila todo el código Java/Kotlin:
# arranca algo más rápido a cambio de más disco. Se pierde con cada actualización de la app;
# volver a correr el script lo restaura.
# No sirve para FLauncher (Flutter) ni, probablemente, para YouTube y Netflix (su código es mayormente nativo).

# ------------------------------------------------------------------ Ola 5: experimento descartado
# Se probó "speed" el 2026-11-06 (benchmarks/*after-wave5* vs *final*): sin mejora medible.
# Spotify en frío varía mucho entre corridas (speed: 841–2127 ms, mediana 847; speed-profile: 683–1515 ms,
# mediana 865) y SystemUI no cambió nada medible. Como speed solo suma disco, quedan en speed-profile
# (lo que el sistema usa por defecto).
5 com.spotify.tv.android speed-profile
5 com.android.systemui speed-profile
