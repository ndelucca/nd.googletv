# Botones del control remoto que deben abrir una app. Lo comprueba scripts/verify.sh --ui con un
# control virtual (uhid) que imita al real a nivel hardware: la prueba pasa por el mismo camino que
# una pulsación de verdad. `input keyevent` no sirve para esto: se saltea los filtros de accesibilidad.
# Formato: <ola> <botón> <código HID (consumer page)> <paquete que debe quedar al frente>
#
# El firmware de TCL le pasa estos botones al launcher de Google TV (launcherx), deshabilitado en la
# ola 0: sin él no hacen nada. Desde la ola 6 los reasigna Plume (Ajustes de Plume → Home & remote →
# Remote keys). Esa asignación vive en los datos privados de Plume, no en este repo: si se borran,
# verify.sh lo detecta y hay que volver a cargarla (docs/research/launchers.md).

# ------------------------------------------------------------------ Ola 6 (etapa 2): launcher
6 netflix   0x51 com.netflix.ninja
6 youtube   0x57 com.google.android.youtube.tv
6 engranaje 0x55 com.android.tv.settings
