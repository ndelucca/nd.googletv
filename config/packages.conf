# Paquetes que deben estar DESHABILITADOS para el usuario 0 (pm disable-user --user 0).
# Lo aplica scripts/apply-packages.sh. Revertir: scripts/rollback.sh o `pm enable <paquete>`.
#
# Formato: <ola> <paquete>   # motivo
# Ola 0 = ya estaba deshabilitado antes de este repo; se registra para que el repo refleje el TV.
# Detalle y fuentes de cada veredicto: docs/PLAN.md y docs/research/.
# Los paquetes de scripts/lib.sh (PROTECTED_BUILTIN) y config/protected.conf nunca se tocan.

# ------------------------------------------------------------------ Ola 0: estado previo
0 com.google.android.apps.tv.launcherx       # launcher de Google TV (~180 MB); reemplazado por FLauncher
0 com.google.android.tungsten.setupwraith    # asistente de setup; reclama HOME. REHABILITAR antes de un reset de fábrica
0 com.google.android.play.games              # Play Juegos
0 com.google.android.videos                  # Google TV / Play Películas
0 com.google.android.syncadapters.calendar   # sincronización de calendario
0 com.tcl.smartalexa                         # puente con Alexa
0 au.com.stan.and                            # Stan (Australia), preinstalada
0 tv.wuaki.apptv                             # Rakuten TV, preinstalada

# ------------------------------------------------------------------ Ola 2: basura de TCL
# Probado en este firmware exacto (cleanyourtv tcl-43c645, grupos 1-4). docs/research/tcl.md
2 com.tcl.bi                    # telemetría (BI)
2 com.tcl.logkit                # captura y subida de logs
2 com.tcl.overseasappshow       # promociones de apps; ~20 MB residentes
2 com.tcl.tv.tclhome_passive    # empuja contenido TCL al arrancar; ~19 MB residentes
2 com.tcl.usercenter            # cuenta TCL; ~20 MB residentes
2 com.tcl.useragreement         # consentimientos/EULA de la telemetría
2 com.tcl.messagebox            # mensajes push de TCL
2 com.tcl.esticker              # etiqueta energética de tienda
2 com.tcl.channelplus           # canales FAST de TCL
2 com.tcl.waterfall.overseas    # "TCL Channel"
2 com.tcl.browser               # navegador TCL (botón Web del control queda sin uso)
2 com.tcl.android.webview       # WebView de TCL; el proveedor activo es el de Google
2 com.tcl.ocean.instructions    # manual electrónico
2 com.tcl.hearaid               # test de audición
2 com.tcl.gamebar               # overlay de modo juego
2 com.tcl.magiconnectfree       # app de celular T-Cast/MagiConnect
2 com.tcl.guard                 # TGuard: "limpiador" que mata apps por su cuenta; ~16 MB. El botón Guard deja de andar

# ------------------------------------------------------------------ Ola 3: Google/AOSP sin uso en un TV
3 com.google.android.onetimeinitializer      # inicializador del primer arranque
3 com.google.android.feedback                # envío de feedback/crashes
3 com.google.android.sss.authbridge          # setup asistido desde el celular
3 android.autoinstalls.config.google.gtvpai  # auto-instalación de apps del setup
3 com.google.android.partnersetup            # personalización del fabricante
3 com.android.camera2                        # cámara
3 com.android.messaging                      # SMS
3 com.android.printspooler                   # impresión
3 org.chromium.webview_shell                 # navegador de prueba de WebView
3 com.android.hotspot2.osulogin              # alta de Passpoint (Hotspot 2.0)
3 com.android.soundpicker                    # selector de tonos
3 com.android.dreams.basic                   # protectores Reloj/Colores (Aerial Views trae el suyo)
3 com.google.android.apps.tv.dreamx          # Modo ambiente de Google; requiere Aerial Views andando (ola 1)
3 com.google.android.marvin.talkback         # lector de pantalla (accesibilidad apagada)

# ------------------------------------------------------------------ Ola 4: según las funciones que se usen
# Decidido el 2026-11-06. Las líneas comentadas son funciones que SE USAN y quedan habilitadas.
4 com.google.android.katniss                 # voz/búsqueda (~66 MB, 22 tareas): no se usa; el botón del micrófono deja de andar
4 com.google.android.tv.assistant            # Google Assistant (va con katniss)
4 com.tcl.assistant                          # puente de voz de TCL
4 com.tcl.micmanager                         # micrófono del control
4 com.tcl.miracast                           # duplicar pantalla (~8 MB): no se usa; Chromecast cubre el caso
4 com.tcl.dashboard                          # panel del engranaje (~23 MB): sin launcherx el botón ya no lo abría
4 com.tcl.ttvs                               # telemetría + OTA de TCL (~18 MB). Para actualizar: scripts/firmware-update.sh
4 com.tcl.versionUpdateApp                   # actualizador de firmware TCL. Ídem
4 com.amazon.amazonvideo.livingroom          # Prime Video: desinstalada a mano el 2026-11-06, pero es de sistema y quedó la versión de fábrica
