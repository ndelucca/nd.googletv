# Modos de app-ops. Lo aplica scripts/apply-appops.sh.
# Formato: <ola> <paquete> <op> <modo>   # motivo
#
# APP_AUTO_START es el bloqueador de autoinicio propio de TCL (TclAppBoot). Por defecto vale "ignore"
# para las apps de terceros, y eso conviene: frena tareas de fondo de Spotify, Crunchyroll, etc.
# Solo se habilita donde hace falta.
# RUN_ANY_IN_BACKGROUND ignore: la app no puede trabajar en segundo plano (sin jobs, alarmas ni servicios).

# ------------------------------------------------------------------ Ola 1: arreglos
1 com.neilturner.aerialviews APP_AUTO_START allow   # sin esto el protector de pantalla falla siempre (bindService failed)

# ------------------------------------------------------------------ Ola 5: segundo plano
# No restringir: Spotify (música de fondo), Aerial Views, el launcher, Jellyfin.
# Disney+, Max y Paramount+ se desinstalaron el 2026-11-06; Prime Video se deshabilita (packages.conf).
5 com.crunchyroll.crunchyroid RUN_ANY_IN_BACKGROUND ignore
