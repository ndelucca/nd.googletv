# Apps instaladas fuera de Play Store (APK). Lo aplica scripts/apply-apps.sh.
# Formato: <ola> <paquete> <versionCode> <sha256 del APK> <url> [grants=PERMISO,...]   # motivo
#
# Instala solo si la app falta o si la versión instalada es menor que <versionCode>.
# El APK descargado se compara con el SHA-256 fijado antes de instalarlo, y Android rechaza
# una actualización firmada con otra clave que la instalada. Para actualizar: cambiar versionCode,
# sha256 y url acá (los APK se cachean en .cache/apks/, fuera de git).
# grants= son permisos que solo se pueden dar por ADB (pm grant).

